<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRYO / 01</title><style>*{box-sizing:border-box}body{margin:0;background:#090e17;color:#e8eef7;font:15px system-ui}header{padding:26px 5%;border-bottom:1px solid #29384b}h1{margin:0;letter-spacing:5px;font-size:32px}small,p{color:#a5b6c9}main{max-width:1200px;margin:auto;padding:24px;display:grid;grid-template-columns:1fr 2fr;gap:18px}section{background:#111b2a;border:1px solid #29384b;border-radius:12px;padding:18px;margin-bottom:12px}h2{font-size:14px;text-transform:uppercase;letter-spacing:2px;color:#8cbedc}label{display:block;margin:12px 0}input,select,textarea,button{font:inherit;color:inherit;background:#17283a;border:1px solid #3a566c;border-radius:6px;padding:9px}input[type=range]{width:100%;accent-color:#55e0c4}button{cursor:pointer;margin:4px}button:hover{background:#28516b}textarea{width:100%;height:200px;font-family:monospace}canvas{width:100%;background:#0b1420;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#66e0c7}output{font-size:24px;color:#66e0c7}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #29384b}@media(max-width:760px){main{grid-template-columns:1fr}}</style><header><h1>CRYO / 01</h1><p>Solar cold-storage digital twin • lumped thermal model</p></header><main><div><section><h2>Operating conditions</h2><label>Ambient °C <input id="ambient" type="range" min="20" max="45" value="30"><span id="av"></span></label><label>Solar array kWp <input id="pv" type="range" min="0" max="3" step=".05" value="1.35"><span id="pvval"></span></label><label>Tank litres <input id="tank" type="range" min="100" max="800" step="50" value="500"><span id="tv"></span></label><label>Door heat load W <input id="door" type="range" min="0" max="400" value="40"><span id="dv"></span></label><label><input id="fault" type="checkbox"> Pump failure</label><button id="reset">Reset</button><button id="play">Pause</button><button id="csv">Export telemetry</button></section><section><h2>Model status</h2><pre id="status"></pre><p>Simulation only. Not calibrated against physical measurements.</p></section></div><div><section><h2>Thermal telemetry • simulated 48 hours</h2><canvas id="chart" width="850" height="340"></canvas><pre>Mint: room temperature   Blue: water tank   Gold: solar power (scaled)</pre></section><section><h2>System schematic</h2><canvas id="system" width="850" height="230"></canvas></section></div></main><script src="engine.js"></script></html>
